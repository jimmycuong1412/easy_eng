version: '3.9'

services:
  # Frontend - Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: easy-eng-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_COMETCHAT_APP_ID=${NEXT_PUBLIC_COMETCHAT_APP_ID}
      - NEXT_PUBLIC_COMETCHAT_REGION=${NEXT_PUBLIC_COMETCHAT_REGION}
      - COMETCHAT_API_KEY=${COMETCHAT_API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - easy-eng-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend - Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: easy-eng-backend-dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://frontend:3000
      - COMETCHAT_APP_ID=${COMETCHAT_APP_ID}
      - COMETCHAT_REGION=${COMETCHAT_REGION}
      - COMETCHAT_API_KEY=${COMETCHAT_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - easy-eng-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis - Caching Layer
  redis:
    image: redis:7-alpine
    container_name: easy-eng-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - easy-eng-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  easy-eng-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
