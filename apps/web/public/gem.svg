<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gemTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="gemLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="gemBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gemShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top facets (crown) -->
  <polygon points="50,8 28,30 72,30" fill="url(#gemTop)" filter="url(#glow)"/>
  <polygon points="50,8 28,30 18,18" fill="#60A5FA"/>
  <polygon points="50,8 72,30 82,18" fill="#2563EB"/>
  <polygon points="18,18 28,30 10,30" fill="#93C5FD"/>
  <polygon points="82,18 72,30 90,30" fill="#1E40AF"/>

  <!-- Middle girdle line -->
  <polygon points="10,30 28,30 20,55 8,45" fill="url(#gemLeft)"/>
  <polygon points="90,30 72,30 80,55 92,45" fill="url(#gemRight)"/>
  <polygon points="28,30 50,30 40,55 20,55" fill="#3B82F6"/>
  <polygon points="72,30 50,30 60,55 80,55" fill="#2563EB"/>
  <polygon points="50,30 50,30 60,55 40,55" fill="#60A5FA"/>

  <!-- Bottom pavilion -->
  <polygon points="8,45 20,55 50,92 10,60" fill="url(#gemBottom)"/>
  <polygon points="92,45 80,55 50,92 90,60" fill="#1E40AF"/>
  <polygon points="20,55 40,55 50,92" fill="#2563EB"/>
  <polygon points="80,55 60,55 50,92" fill="#1D4ED8"/>
  <polygon points="40,55 60,55 50,92" fill="#3B82F6"/>
  <polygon points="10,60 50,92 8,45" fill="#1E3A8A"/>
  <polygon points="90,60 50,92 92,45" fill="#1E40AF"/>

  <!-- Shine / highlight -->
  <polygon points="50,8 28,30 50,30" fill="url(#gemShine)" opacity="0.7"/>
  <ellipse cx="38" cy="22" rx="6" ry="4" fill="white" opacity="0.5" transform="rotate(-20,38,22)"/>
</svg>
