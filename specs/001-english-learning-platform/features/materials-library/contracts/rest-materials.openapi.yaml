openapi: 3.0.3
info:
  title: EasyEng — Materials Library
  version: 1.0.0
  description: |
    REST surface backing the Materials Library feature. Endpoints under
    `/rest/v1/*` are auto-generated by Supabase PostgREST from the schema
    in `data-model.md`. Custom verbs (publish, grade, complete) live under
    `/functions/v1/*` (Supabase Edge Functions) or `/rest/v1/rpc/*` (Postgres RPC).

servers:
  - url: https://evrcwtsexlamacawofxo.supabase.co
    description: Project Supabase host

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    Material:
      type: object
      required: [id, slug, type, level, status, title_vi, summary_vi, body_vi, duration_min, gems_reward, xp_reward, author_id, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 96 }
        type: { type: string, enum: [vocabulary_pack, grammar_lesson, reading_passage, listening_audio, dialogue, mock_test] }
        level: { type: string, enum: [a1, a2, b1, b2, c1] }
        status: { type: string, enum: [draft, in_review, published, archived] }
        goal: { type: string, enum: [school, vstep, toeic, ielts, business, study_abroad, conversation, travel], nullable: true }
        title_vi: { type: string }
        title_en: { type: string, nullable: true }
        summary_vi: { type: string }
        summary_en: { type: string, nullable: true }
        body_vi: { type: string, description: 'Markdown' }
        body_en: { type: string, nullable: true, description: 'Markdown' }
        duration_min: { type: integer, minimum: 1, maximum: 90 }
        gems_reward: { type: integer, minimum: 0 }
        xp_reward: { type: integer, minimum: 0 }
        min_completion_pct: { type: integer, minimum: 0, maximum: 100 }
        cover_path: { type: string, nullable: true }
        popularity_score: { type: number, format: float }
        author_id: { type: string, format: uuid }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    MaterialSummary:
      type: object
      description: Card-sized projection used by the catalog list endpoint.
      required: [id, slug, type, level, title, summary, duration_min, cover_url, gems_reward]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        type: { type: string }
        level: { type: string }
        goal: { type: string, nullable: true }
        title: { type: string, description: 'Resolved per locale' }
        summary: { type: string, description: 'Resolved per locale' }
        duration_min: { type: integer }
        cover_url: { type: string, nullable: true, format: uri }
        gems_reward: { type: integer }
        xp_reward: { type: integer }
    MaterialProgress:
      type: object
      required: [user_id, material_id, started_at, completion_pct, state]
      properties:
        user_id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        completion_pct: { type: integer }
        score_pct: { type: integer, nullable: true }
        gems_awarded: { type: integer }
        xp_awarded: { type: integer }
        state: { type: string, enum: [in_progress, completed, abandoned] }
    MockTestItemPublic:
      type: object
      description: Public projection — never includes `correct_index` or `explanation_*`.
      required: [id, idx, format, prompt_vi, prompt_en, options_en, points]
      properties:
        id: { type: string, format: uuid }
        idx: { type: integer }
        format: { type: string, enum: [multiple_choice, fill_in_blank, true_false, matching] }
        prompt_vi: { type: string }
        prompt_en: { type: string }
        options_en: { type: array, items: { type: string }, minItems: 2, maxItems: 6 }
        options_vi: { type: array, items: { type: string }, nullable: true }
        points: { type: integer }
    AwardResult:
      type: object
      required: [already_completed]
      properties:
        already_completed: { type: boolean }
        gems_awarded: { type: integer, nullable: true }
        xp_awarded: { type: integer, nullable: true }
    GradeResult:
      type: object
      required: [score_pct, items_correct, items_total, per_item]
      properties:
        score_pct: { type: integer, minimum: 0, maximum: 100 }
        items_correct: { type: integer }
        items_total: { type: integer }
        gems_awarded: { type: integer }
        xp_awarded: { type: integer }
        per_item:
          type: array
          items:
            type: object
            required: [idx, correct]
            properties:
              idx: { type: integer }
              correct: { type: boolean }
              correct_index: { type: integer, description: 'The correct option index, exposed only after submit.' }
              explanation_vi: { type: string }
              explanation_en: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        hint: { type: string, nullable: true }

security:
  - bearerAuth: []
    apiKey: []

paths:
  /rest/v1/materials:
    get:
      summary: List published materials (catalog)
      description: |
        Auto-generated PostgREST. Anonymous-friendly (RLS limits to `status=eq.published`).
        Frontend always sends `select=` projecting to MaterialSummary fields.
      parameters:
        - { name: status, in: query, schema: { type: string, default: 'eq.published' } }
        - { name: type, in: query, schema: { type: string, example: 'in.(vocabulary_pack,grammar_lesson)' } }
        - { name: level, in: query, schema: { type: string, example: 'eq.b1' } }
        - { name: goal, in: query, schema: { type: string, example: 'eq.ielts' } }
        - { name: order, in: query, schema: { type: string, default: 'popularity_score.desc.nullslast' } }
        - { name: limit, in: query, schema: { type: integer, default: 24, maximum: 60 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaterialSummary' }
        '400': { description: Bad query, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /rest/v1/materials?slug=eq.{slug}:
    get:
      summary: Read one material by slug
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Returns 0 or 1 material (RLS may hide drafts)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Material' }

  /rest/v1/material_progress:
    get:
      summary: Read own progress rows
      description: RLS scopes to `user_id = auth.uid()`.
      responses:
        '200':
          description: Progress entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaterialProgress' }
    post:
      summary: Upsert in-progress row (start or update completion_pct)
      description: |
        Frontend uses this to mark started + sync interim progress. Award + completed_at
        are NEVER set here — they only come from the `award_material_completion` RPC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material_id, completion_pct]
              properties:
                material_id: { type: string, format: uuid }
                completion_pct: { type: integer, minimum: 0, maximum: 100 }
                meta: { type: object }
      responses:
        '201': { description: Created }
        '200': { description: Updated (Prefer: resolution=merge-duplicates) }

  /rest/v1/rpc/award_material_completion:
    post:
      summary: Atomic completion + reward
      description: See `rpc-award-completion.md` for full contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_material_id]
              properties:
                p_user_id: { type: string, format: uuid }
                p_material_id: { type: string, format: uuid }
                p_score: { type: integer, nullable: true }
      responses:
        '200':
          description: Award outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AwardResult' }
        '403': { description: 'Material not published or RLS denied' }

  /rest/v1/rpc/grade_mock_test:
    post:
      summary: Server-side mock test grading
      description: See `rpc-grade-mock-test.md` for full contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_material_id, p_answers]
              properties:
                p_user_id: { type: string, format: uuid }
                p_material_id: { type: string, format: uuid }
                p_answers: { type: object, description: 'idx → answer index/string mapping' }
      responses:
        '200':
          description: Grade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeResult' }

  /rest/v1/mock_test_items_public:
    get:
      summary: Public-safe mock test item list (no answer key)
      description: View that hides `correct_index` and `explanation_*`.
      parameters:
        - { name: material_id, in: query, schema: { type: string, format: uuid } }
        - { name: order, in: query, schema: { type: string, default: 'idx.asc' } }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MockTestItemPublic' }

  /functions/v1/materials-publish:
    post:
      summary: State-transition endpoint (admin only)
      description: |
        Edge Function. See `edge-publish.md` for full contract. Validates role,
        emits `audit_log` row, runs final consistency checks (bilingual fields
        present, at least one section, etc.), then updates `materials.status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material_id, action]
              properties:
                material_id: { type: string, format: uuid }
                action: { type: string, enum: [submit_for_review, approve, reject, archive, restore] }
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: New status
          content:
            application/json:
              schema:
                type: object
                properties:
                  material_id: { type: string }
                  status: { type: string }
        '403': { description: Role check failed }
        '422': { description: Validation failed (e.g. en fields missing) }
