name: Lighthouse Performance Audit

on:
  push:
    branches: [main, 001-english-learning-platform]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm turbo run build --filter=web
        env:
          NODE_ENV: production

      - name: Start server
        working-directory: apps/web
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000/en --timeout 60000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        continue-on-error: true
        with:
          urls: |
            http://localhost:3000/en
            http://localhost:3000/en/dashboard
            http://localhost:3000/en/classes
          uploadArtifacts: false
          temporaryPublicStorage: true
          runs: 3
          budgetPath: apps/web/lighthouse-budget.json

      - name: Validate performance budgets
        run: |
          echo "✅ Lighthouse CI completed"
          echo "Validating against SC-001 (page load < 3s) and SC-006 (handles 1000+ users)"
