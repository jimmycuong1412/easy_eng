name: Test Suite

on:
  push:
    branches: [main, 001-english-learning-platform, 002-mobile-apps]
  pull_request:
    branches: [main, 001-english-learning-platform, 002-mobile-apps]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm --filter web test:coverage

      - name: Check coverage threshold (5%)
        working-directory: apps/web
        run: |
          pnpm test:coverage -- --coverageReporters=json-summary
          node -e "
            const coverage = require('./coverage/coverage-summary.json').total;
            const threshold = 5;
            const metrics = ['lines', 'statements', 'functions', 'branches'];
            metrics.forEach(m => {
              if (coverage[m].pct < threshold) {
                throw new Error(\`Coverage for \${m} is \${coverage[m].pct}%, below \${threshold}%\`);
              }
            });
            console.log('✅ All coverage metrics meet threshold');
          "

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: ./apps/web/coverage

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm --filter web e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
