name: Deploy

on:
  push:
    branches: [001-english-learning-platform]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────
  # 1. Build & Test
  # ──────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo run type-check --filter=web

      - name: Lint
        run: pnpm turbo run lint --filter=web

      - name: Unit tests
        run: pnpm --filter web test -- --ci --passWithNoTests

      - name: Build
        run: pnpm turbo run build --filter=web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_COMETCHAT_APP_ID: ${{ secrets.NEXT_PUBLIC_COMETCHAT_APP_ID }}
          NEXT_PUBLIC_COMETCHAT_REGION: ${{ secrets.NEXT_PUBLIC_COMETCHAT_REGION }}
          NEXT_PUBLIC_COMETCHAT_AUTH_KEY: ${{ secrets.NEXT_PUBLIC_COMETCHAT_AUTH_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            apps/web/.next/standalone
            apps/web/.next/static
            apps/web/public
          retention-days: 1

  # ──────────────────────────────────────────────────
  # 2. Deploy Supabase migrations
  # ──────────────────────────────────────────────────
  deploy-supabase:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # Preflight: validate the access token before attempting deploy. If it's
      # missing or invalid we SKIP (not fail) so the pipeline isn't blocked —
      # migrations can be applied manually meanwhile. Fix by regenerating a
      # token at app.supabase.com → Account → Access Tokens and updating the
      # SUPABASE_ACCESS_TOKEN secret in the GitHub Production environment.
      - name: Preflight — validate Supabase access token
        id: preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping Supabase deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects)
          if [ "$code" != "200" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN invalid (HTTP $code) — skipping Supabase deploy. Regenerate it at app.supabase.com → Account → Access Tokens."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.preflight.outputs.ok == 'true'
        with:
          version: latest

      - name: Link Supabase project
        if: steps.preflight.outputs.ok == 'true'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        if: steps.preflight.outputs.ok == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        if: steps.preflight.outputs.ok == 'true'
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ──────────────────────────────────────────────────
  # 3. Deploy Frontend (Vercel)
  # ──────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" || "${{ github.ref }}" == "refs/heads/001-english-learning-platform" ]]; then
            vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
          else
            vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ──────────────────────────────────────────────────
  # 4. Post-deploy health check
  # ──────────────────────────────────────────────────
  health-check:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          DEPLOY_URL="${{ secrets.DEPLOY_URL || 'https://easyeng-dev.vercel.app' }}"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "$DEPLOY_URL/")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_STATUS)"

      - name: Notify success
        if: success()
        run: echo "Deployment completed successfully"

      - name: Notify failure
        if: failure()
        run: echo "::error::Deployment health check failed — investigate immediately"
