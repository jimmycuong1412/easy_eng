name: Accessibility Tests (WCAG 2.1 Level AA)

on:
  push:
    branches: [main, 001-english-learning-platform]
  pull_request:
    branches: [main, 001-english-learning-platform]

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Run accessibility unit tests
        working-directory: apps/web
        run: npm run test -- --testMatch="**/*.a11y.test.tsx" --passWithNoTests

      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run accessibility E2E tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/accessibility.spec.ts
        env:
          CI: true

      - name: Generate accessibility report
        if: always()
        working-directory: apps/web
        run: npx playwright show-report

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: apps/web/test-results/
          retention-days: 30

      - name: Comment PR with accessibility results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '### Accessibility Test Results (WCAG 2.1 Level AA)\n\n';

            try {
              const junitPath = path.join(process.cwd(), 'apps/web/test-results/junit.xml');
              if (fs.existsSync(junitPath)) {
                const junitContent = fs.readFileSync(junitPath, 'utf8');
                const testsMatch = junitContent.match(/tests="(\d+)"/);
                const failuresMatch = junitContent.match(/failures="(\d+)"/);
                const errorsMatch = junitContent.match(/errors="(\d+)"/);

                if (testsMatch) {
                  const tests = testsMatch[1];
                  const failures = failuresMatch ? failuresMatch[1] : '0';
                  const errors = errorsMatch ? errorsMatch[1] : '0';
                  const passed = parseInt(tests) - parseInt(failures) - parseInt(errors);

                  comment += `- **Total Tests:** ${tests}\n`;
                  comment += `- **Passed:** ${passed}\n`;
                  comment += `- **Failed:** ${failures}\n`;
                  comment += `- **Errors:** ${errors}\n\n`;

                  if (parseInt(failures) > 0 || parseInt(errors) > 0) {
                    comment += `⚠️ **Accessibility violations detected!**\n\n`;
                    comment += `Please review the [accessibility report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix all violations before merging.\n\n`;
                    comment += `All pages must comply with WCAG 2.1 Level AA standards.\n`;
                  } else {
                    comment += `✅ **All accessibility tests passed!**\n\n`;
                    comment += `Application is WCAG 2.1 Level AA compliant.\n`;
                  }
                }
              }
            } catch (error) {
              console.error('Error reading test results:', error);
              comment += 'Could not parse test results. Please check the workflow logs.\n';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on violations
        if: failure()
        working-directory: apps/web
        run: |
          echo "::error::Accessibility violations detected! WCAG 2.1 Level AA compliance is required."
          echo "::error::Please review the accessibility test report and fix all violations."
          echo "::error::Build cannot proceed until all accessibility issues are resolved."
          exit 1
